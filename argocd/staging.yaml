apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/platform/gitops.git
    targetRevision: main
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: payment-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
